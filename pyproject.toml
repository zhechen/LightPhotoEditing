[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lightedit"
version = "0.1.0"
description = "A small, local-first raster photo editor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7", "numpy>=1.26", "opencv-python-headless>=4.9", "Pillow>=10.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5", "pyinstaller>=6.8"]

[project.scripts]
lightedit = "lightedit.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py311"
line-length = 100

